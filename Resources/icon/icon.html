<!doctype html>
<html><head><style>html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}</style></head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4b9bff"/>
      <stop offset="0.55" stop-color="#1663ea"/>
      <stop offset="1" stop-color="#0a2f8f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8ff"/>
    </linearGradient>
    <radialGradient id="dot" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset=".6" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#d70015"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001040" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001a66" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ff2d20" flood-opacity=".55"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- countdown ring -->
  <circle cx="512" cy="512" r="232" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="66"/>
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="232" fill="none" stroke="url(#arc)" stroke-width="66" stroke-linecap="round"
            stroke-dasharray="1050 2000" transform="rotate(-90 512 512)"/>
  </g>
  <!-- the "now" dot at the end of the countdown -->
  <circle cx="284" cy="555" r="46" fill="url(#dot)" filter="url(#glow)"/>
  <circle cx="284" cy="555" r="46" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3"/>
</svg>
</body></html>
